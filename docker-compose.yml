version: '3.8'

services:
  # ============================================================================
  # 1. llama.cpp Server (Clef-Flash GGUF 推論核心)
  # ============================================================================
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: clef-flash-gguf-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./models:/models:ro
    command:
      - -m
      - /models/Cloudflare_clef-flash-Q4_K_M.gguf
      - --mmproj
      - /models/mmproj-Cloudflare_clef-flash-f16.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "16384"
      - -b
      - "4096"
      - -ub
      - "4096"
      - -t
      - "16"
      - -np
      - "2"

  # ============================================================================
  # 2. FastAPI Facade (OpenAPI / Swagger / 遙測指標推送)
  # ============================================================================
  api-facade:
    build: .
    container_name: clef-flash-api
    restart: unless-stopped
    depends_on:
      - llama-server
    ports:
      - "0.0.0.0:8099:8099"
    environment:
      - BACKEND_URL=http://llama-server:8080
      - HOST_NAME=10.9.0.99
      - INFLUX_URL=http://10.9.0.9:8008/api/v2/write?org=main&bucket=telegraf&precision=s
      - INFLUX_TOKEN=7f291e7ddcfa80d05deb46d3eb6137b54553e72241378f3c
