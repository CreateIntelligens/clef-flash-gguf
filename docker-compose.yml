services:
  clef-flash-gguf-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: clef-flash-gguf-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./models:/models:ro
    command:
      - -m
      - /models/Cloudflare_clef-flash-Q4_K_M.gguf
      - --mmproj
      - /models/mmproj-Cloudflare_clef-flash-f16.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "16384"
      - -b
      - "4096"
      - -ub
      - "4096"
      - -t
      - "8"
      - -np
      - "2"
